<!-- Full upgraded design with dotted guide box -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capture Document Front</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #eef2ff, #f8fafc);
      min-height: 100vh;
      color: #111827;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: #ffffff;
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      text-align: center;
      padding: 8px 0;
    }

    .header h2 {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 14px;
      color: #6b7280;
    }

    .field label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .doc-select {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #d1d5db;
      font-size: 16px;
      background: #fff;
      outline: none;
    }

    .doc-select:focus {
      border-color: #00975d;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }

    .doc-select.error {
      border-color: #dc2626;
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.12);
    }

    .error-message {
      color: #dc2626;
      font-size: 13px;
      margin-top: 6px;
      min-height: 18px;
    }

    .video-box {
      width: 100%;
      height: 54vh;
      max-height: 440px;
      min-height: 330px;
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      background: #020617;
      border: 1px solid #e5e7eb;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .guide {
      position: absolute;
      left: 7%;
      top: 15%;
      width: 86%;
      height: 70%;
      border: 3px dashed #22c55e;
      border-radius: 14px;
      pointer-events: none;
      box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.28);
      animation: pulse 2s infinite;
    }

    .guide::before {
      content: "Align document inside this box";
      position: absolute;
      top: -34px;
      left: 50%;
      transform: translateX(-50%);
      background: #22c55e;
      color: white;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      white-space: nowrap;
    }

    @keyframes pulse {
      0% {
        border-color: #22c55e;
      }

      50% {
        border-color: #4ade80;
      }

      100% {
        border-color: #22c55e;
      }
    }

    canvas {
      display: none;
    }

    .status {
      padding: 13px;
      border-radius: 14px;
      background: #eef2ff;
      text-align: center;
      font-size: 15px;
      color: #3730a3;
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #00975d;
      color: white;
    }

    .btn:hover {
      background: #018150;
    }

    .btn.secondary {
      background: #f3f4f6;
      color: #374151;
    }

    .btn.secondary:hover {
      background: #e5e7eb;
    }

    @media (max-width: 480px) {
      .page {
        padding: 0;
      }

      .card {
        min-height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }

      .actions {
        flex-direction: column;
      }

      .video-box {
        height: 52vh;
        min-height: 300px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <div class="header">
        <h2>Capture Document Front</h2>
        <p>Select document type and place the front side inside the frame.</p>
      </div>

      <div class="field">
        <label for="documentType">Document Type</label>
        <select id="documentType" class="doc-select">
          <option value="">-- Select Document Type --</option>
          <option value="NID">National ID</option>
          <option value="SMART_CARD">Smart Card</option>
          <option value="PASSPORT">Passport</option>
          <option value="DRIVING_LICENSE">Driving License</option>
        </select>
        <div id="documentTypeError" class="error-message"></div>
      </div>

      <div class="video-box">
        <video id="video" autoplay muted playsinline></video>
        <div class="guide"></div>
      </div>

      <canvas id="canvas"></canvas>

      <div id="status" class="status">Starting camera...</div>

      <div class="actions">
        <button class="btn" onclick="captureDocumentFront()">Capture Front</button>
        <button class="btn secondary" onclick="resetCapture()">Retry</button>
      </div>
    </div>
  </div>

  <script>
    const documentTypeSelect = document.getElementById("documentType");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const statusText = document.getElementById("status");
    const errorDiv = document.getElementById("documentTypeError");

    let captured = false;

    function getKycToken() {
      const params = new URLSearchParams(window.location.search);
      return params.get("token") || sessionStorage.getItem("kyc_token");
    }

    documentTypeSelect.addEventListener("change", () => {
      documentTypeSelect.classList.remove("error");
      errorDiv.innerText = "";
    });

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        await new Promise(resolve => {
          video.onloadedmetadata = () => {
            video.play();
            resolve();
          };
        });

        statusText.innerText = "Place document front inside the box";
      } catch (e) {
        console.error(e);
        statusText.innerText = "Camera access failed";
      }
    }

    function captureDocumentFront() {
      const token = getKycToken();

      if (captured) return;

      const documentType = documentTypeSelect.value;

      if (!documentType) {
        documentTypeSelect.classList.add("error");
        errorDiv.innerText = "Please select a document type.";
        documentTypeSelect.focus();
        return;
      }

      if (!token) {
        alert("KYC session expired or invalid");
        window.location.href = "/verify";
        return;
      }

      sessionStorage.setItem("kyc_document_type", documentType);

      captured = true;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imageData = canvas.toDataURL("image/jpeg", 0.9);

      statusText.innerText = "Uploading document front...";

      fetch(`/api/v1/kyc/sessions/${token}/documents/front`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          image: imageData,
          documentType: documentType
        })
      })
        .then(res => res.json())
        .then(data => {
          console.log("Document front upload success:", data);
          statusText.innerText = "Document front uploaded successfully";

          setTimeout(() => {
            window.location.href = `/document-back.html?token=${encodeURIComponent(token)}`;
          }, 800);
        })
        .catch(err => {
          console.error(err);
          statusText.innerText = "Upload failed. Please try again.";
          captured = false;
        });
    }

    function resetCapture() {
      captured = false;

      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      statusText.innerText = "Place document front inside the box";
    }

    window.onload = startCamera;
  </script>
</body>

</html>
