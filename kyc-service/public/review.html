<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KYC Review</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #eef2ff, #f8fafc);
      width: 100vw;
      min-height: 100vh;
      color: #111827;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #6b7280;
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .status-box {
      padding: 14px;
      border-radius: 14px;
      background: #eef2ff;
      margin-top: 12px;
      font-size: 15px;
      color: #111827;
      line-height: 1.4;
      font-weight: 600;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .warning {
      background: #fef3c7;
      color: #92400e;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      cursor: pointer;
      background: #00975d;;
      color: white;
      margin-top: 22px;
      font-weight: 700;
    }

    .btn:hover {
      background: #01784b;;
    }

    .btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .failure-actions {
      display: none;
      gap: 10px;
      margin-top: 12px;
    }

    .failure-actions .btn {
      margin-top: 0;
    }

    .btn.secondary {
      background: #f3f4f6;
      color: #374151;
    }

    .btn.secondary:hover {
      background: #e5e7eb;
    }

    .btn.danger {
      background: #dc2626;
      color: white;
    }

    .btn.danger:hover {
      background: #b91c1c;
    }

    @media (max-width: 480px) {
      .container {
        padding: 0;
        align-items: stretch;
      }

      .card {
        min-height: 100vh;
        border-radius: 0;
        padding: 22px 16px;
        box-shadow: none;
      }

      h1 {
        font-size: 25px;
      }

      h2 {
        font-size: 18px;
      }

      .status-box {
        font-size: 14px;
      }

      .failure-actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>KYC Review</h1>

      <p>
        Your submitted selfie and document images are ready for verification.
      </p>

      <h2>Verification Checks</h2>

      <div id="faceStatus" class="status-box">
        Waiting for face verification...
      </div>

      <div id="ocrStatus" class="status-box">
        Waiting for OCR extraction...
      </div>

      <div id="livenessStatus" class="status-box">
        Waiting for liveness validation...
      </div>

      <div id="finalStatus" class="status-box warning">
        Verification in progress...
      </div>

      <button id="verifyBtn" class="btn" onclick="startVerification()">
        Start Background Verification
      </button>

      <div id="failureActions" class="failure-actions">
        <button class="btn secondary" onclick="goToFrontScan()">
          Try Again
        </button>

        <button class="btn danger" onclick="continueSubmission()">
          Continue Submission
        </button>
      </div>

    </div>
  </div>

  <script>
    function getKycToken() {
      const params = new URLSearchParams(window.location.search);
      return params.get("token") || sessionStorage.getItem("kyc_token");
    }

    function showFailureOptions(message) {
      const finalStatus = document.getElementById("finalStatus");
      const verifyBtn = document.getElementById("verifyBtn");
      const failureActions = document.getElementById("failureActions");

      finalStatus.className = "status-box error";
      finalStatus.innerText = message;

      verifyBtn.style.display = "none";
      failureActions.style.display = "flex";
    }

    function goToFrontScan() {
      const token = getKycToken();

      sessionStorage.removeItem("kyc_document_type");

      if (!token) {
        window.location.href = "/verify";
        return;
      }

      window.location.href =
        `/document-front.html?token=${encodeURIComponent(token)}`;
    }

    async function continueSubmission() {
      const token = getKycToken();
      const finalStatus = document.getElementById("finalStatus");
      const failureActions = document.getElementById("failureActions");

      if (!token) {
        window.location.href = "/verify";
        return;
      }

      failureActions.style.display = "none";

      finalStatus.className = "status-box warning";
      finalStatus.innerText = "Continuing submission for manual review...";

      try {
        const completeRes = await fetch(
          `/api/v1/kyc/sessions/${token}/complete`,
          {
            method: "GET",
          }
        );

        const completeData = await completeRes.json();

        if (!completeRes.ok || !completeData.redirectUrl) {
          finalStatus.className = "status-box error";
          finalStatus.innerText =
            "Unable to continue submission. Please try again.";
          failureActions.style.display = "flex";
          return;
        }

        finalStatus.className = "status-box success";
        finalStatus.innerText =
          "Submission continued successfully. Redirecting...";

        setTimeout(() => {
          window.location.href = completeData.redirectUrl;
        }, 1000);

      } catch (error) {
        console.error(error);

        finalStatus.className = "status-box error";
        finalStatus.innerText =
          "Unable to continue submission due to a system error.";
        failureActions.style.display = "flex";
      }
    }

    async function startVerification() {
      const token = getKycToken();

      const faceStatus = document.getElementById("faceStatus");
      const ocrStatus = document.getElementById("ocrStatus");
      const livenessStatus = document.getElementById("livenessStatus");
      const finalStatus = document.getElementById("finalStatus");
      const verifyBtn = document.getElementById("verifyBtn");
      const failureActions = document.getElementById("failureActions");

      if (!token) {
        alert("KYC session expired or invalid");
        window.location.href = "/verify";
        return;
      }

      try {
        verifyBtn.disabled = true;
        verifyBtn.innerText = "Verification Running...";
        failureActions.style.display = "none";

        finalStatus.className = "status-box warning";
        finalStatus.innerText = "Running verification checks...";

        faceStatus.className = "status-box warning";
        faceStatus.innerText = "Running face comparison...";

        const faceRes = await fetch(
          `/api/v1/kyc/sessions/${token}/face-check-by-token`,
          {
            method: "POST",
          }
        );

        const faceData = await faceRes.json();

        if (!faceRes.ok || !faceData.matched) {
          faceStatus.className = "status-box error";
          faceStatus.innerText =
            faceData.reason || "Face verification failed";

          showFailureOptions(
            "Face verification failed. You can try again or continue submission for manual review."
          );

          return;
        }

        faceStatus.className = "status-box success";
        faceStatus.innerText =
          `Face matched successfully. Score: ${Number(faceData.similarity).toFixed(2)}%`;

        ocrStatus.className = "status-box warning";
        ocrStatus.innerText = "Extracting document information...";

        const ocrRes = await fetch(
          `/api/v1/kyc/sessions/${token}/ocr-by-token`,
          {
            method: "POST",
          }
        );

        const ocrData = await ocrRes.json();

        if (!ocrRes.ok || !ocrData.success) {
          ocrStatus.className = "status-box error";
          ocrStatus.innerText =
            ocrData.reason || "OCR extraction failed";

          showFailureOptions(
            "Document verification failed. You can try again with clearer images or continue submission for manual review."
          );

          return;
        }

        ocrStatus.className = "status-box success";
        ocrStatus.innerText = "OCR completed successfully.";

        livenessStatus.className = "status-box success";
        livenessStatus.innerText = "Liveness verification passed";

        finalStatus.className = "status-box warning";
        finalStatus.innerText = "Finalizing KYC session...";

        const completeRes = await fetch(
          `/api/v1/kyc/sessions/${token}/complete`,
          {
            method: "GET",
          }
        );

        const completeData = await completeRes.json();

        if (!completeRes.ok || !completeData.redirectUrl) {
          showFailureOptions(
            "KYC completion failed. You can try again or continue submission for manual review."
          );
          return;
        }

        finalStatus.className = "status-box success";
        finalStatus.innerText = "KYC verification completed successfully";

        verifyBtn.innerText = "Completed";

        setTimeout(() => {
          window.location.href = completeData.redirectUrl;
        }, 1000);

      } catch (error) {
        console.error(error);

        showFailureOptions(
          "Verification failed due to a system error. You can try again or continue submission for manual review."
        );
      }
    }
  </script>

</body>

</html>
