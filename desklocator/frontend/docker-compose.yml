name: task-manager-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_KYC_URL: "https://kyc.apprain.ca"
        NEXT_PUBLIC_SERVICE_URL: "http://localhost:3000"
    container_name: task-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_KYC_URL: "https://kyc.apprain.ca"
      NEXT_PUBLIC_SERVICE_URL: "http://localhost:3000"
